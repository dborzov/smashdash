id: copy-mirror
title: The Copy Mirror
skill: copy-groups
beats:
  - type: say
    who: ogre
    text: >-
      Every lunchtime we put one parcel in front of the Copy Mirror. Inside: one mystery box
      of sandwiches, and two gold coins for pudding.
  - type: show
    text: "One parcel: one box and two coins. The bracket is the wrapping paper."
    math: '(x + 2)'
    widget: { kind: groups, n: 1, c: 2 }
  - type: say
    who: ogre
    text: >-
      Two heads, two lunches. So the mirror has to make **two** copies of the whole parcel.
      We write that as $2(x + 2)$.
  - type: play
    text: Unpack both parcels and see what you get!
    widget: { kind: groups, n: 2, c: 2, sort: true }
    done: "Two parcels hold two boxes and four coins: $2(x + 2) = 2x + 4$."
  - type: input
    who: ogre
    text: How many **coins** are in $2(x + 2)$?
    widget: { kind: groups, n: 2, c: 2 }
    answer: 4
    nudges:
      - { value: 2, text: "That's one parcel's worth. The mirror made **two** parcels!" }
    explain: "Two parcels with 2 coins each: $2 \\times 2 = 4$ coins."
  - type: say
    who: grimble
    text: >-
      So the number outside the bracket is a **photocopier**. It copies *everything* inside —
      the box AND the coins. Not just the first thing. Are you listening, Halfcopy?
  - type: ask
    who: grimble
    text: What does $3(x + 1)$ mean?
    options:
      - "Three copies of the parcel $(x + 1)$"
      - "$3x$, then add 1"
      - "$x + 1 + 3$"
    correct: 0
    nudges:
      "1": "That's Halfcopy-style! The 3 copies the **whole** parcel, so the 1 gets copied too."
      "2": "The 3 isn't a coin to add on. It tells you how many **copies**."
    explain: "$3(x + 1) = (x + 1) + (x + 1) + (x + 1)$: three whole parcels."
  - type: play
    text: Unpack $3(x + 1)$!
    widget: { kind: groups, n: 3, c: 1, sort: true }
    done: "Three boxes, three coins: $3(x + 1) = 3x + 3$."
  - type: input
    who: ogre
    text: Now in your head. How many coins are in $4(x + 3)$?
    math: '4(x + 3)'
    answer: 12
    nudges:
      - { value: 3, text: "That's just one parcel. There are four!" }
      - { value: 7, text: "Not plus: 4 parcels of 3 coins is $4 \\times 3$." }
    hint: Four parcels, three coins in each.
    explain: "$4 \\times 3 = 12$ coins (and 4 boxes): $4(x + 3) = 4x + 12$."
  - type: practice
    skill: copy-groups
    count: 4
  - type: say
    who: ogre
    text: >-
      "My sandwiches!" "MY pudding coins!" "OUR lunch!" "…We're going to need a bigger stomach."

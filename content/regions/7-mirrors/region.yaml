palette: { sky: ["#120a2e", "#3a8fd6"], accent: "#8ff0ff", ground: "#3b2d6b" }
outro: mirrors-outro
monsters:
  - { name: Mirror Mimic, seed: 61, hue: 190, taunts: ["I'm you! But worse!", "Copy THIS!"] }
  - { name: Crystal Bat, seed: 62, hue: 280, taunts: ["Skreee! I eat columns!", "Crunchy crystals!"] }
  - { name: Echo Goblin, seed: 63, hue: 140, taunts: ["Nyeh! Nyeh! …nyeh… nyeh…", "Copy copy copy!"] }

      - "Every bracket in this cave is MY bracket now. You'll never bust them all!"
    phases:
      - { skills: [copy-groups, expand], count: 3, taunt: "Copy, copy, copy… HALF! Hee hee!" }
      - { skills: [expand-check, expand], count: 3, taunt: "These rules are TOTALLY real. Don't test them. Please don't test them." }
      - { skills: [split-tens, round-down], count: 3, taunt: "Seven times nine is sixty-NINE! Probably! Ish!" }
    defeat: "Fine! FINE! I'll copy the whole parcel! Both coins! Even the pudding! …I hate pudding."

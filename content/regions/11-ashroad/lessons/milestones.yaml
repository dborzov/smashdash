id: milestones
title: Milestones
skill: pv-numberline
beats:
  - type: narrate
    text: >-
      Every mile marker on the Ashen Road has been burned. Wren is making new ones out of charred
      planks and chalk.
  - type: say
    who: wren
    text: >-
      A number line is just a road with markers. Before you count jumps, work out what **one
      jump** is worth. People who skip that step end up in the river.
  - type: show
    who: wren
    text: From 0 to 1,000,000 in ten jumps. Each jump is worth 100,000.
    widget: { kind: numberline, min: 0, max: 1000000, step: 100000, labels: all }
  - type: input
    who: wren
    text: What number is the arrow pointing to?
    widget: { kind: numberline, min: 0, max: 100000, step: 10000, labels: ends, arrow: 70000 }
    answer: 70000
    atom: read-tick
    nudges:
      - { value: 7, text: "That's how many jumps. What is each jump worth? (Ten jumps make 100,000.)" }
      - { value: 700000, text: "Check the end of the line: it stops at 100,000." }
    explain: "Ten jumps make 100,000, so one jump is 10,000. Seven jumps: **70,000**."
  - type: input
    who: wren
    text: And here — the arrow is halfway between two markers.
    widget: { kind: numberline, min: 0, max: 1000000, step: 100000, labels: ends, arrow: 350000 }
    answer: 350000
    atom: between
    nudges:
      - { value: 35, text: "That's jumps, not a number. Each jump is 100,000." }
      - { value: 300000, text: "It's halfway past 300,000 — half a jump is 50,000." }
    explain: "3½ jumps of 100,000: **350,000**."
  - type: play
    who: voss
    text: The scouts camp at the 2,600,000 mark. Plant the banner there.
    widget: { kind: numberline, min: 2000000, max: 3000000, step: 100000, labels: all, target: 2600000, tolerance: 0 }
    done: "Six jumps of 100,000 past 2,000,000."
  - type: input
    who: hobb
    text: This stretch of road doesn't start at 0. Where's the arrow?
    widget: { kind: numberline, min: 4500000, max: 4600000, step: 10000, labels: all, arrow: 4530000 }
    answer: 4530000
    atom: offset
    nudges:
      - { value: 30000, text: "The road doesn't start at 0 — it starts at 4,500,000." }
      - { value: 4800000, text: "Each jump here is only 10,000." }
    explain: "Three jumps of 10,000 past 4,500,000: **4,530,000**."
  - type: practice
    skill: pv-numberline
    count: 4

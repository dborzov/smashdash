    intro:
      - "*A man in a clerk's coat steps out from behind a burned wagon, wiping ink from a quill as long as a knife.*"
      - "Maul Vane, at your service. I don't kill anyone, Reckoner. I just move a digit. One little slide to the left, and your Marshal sends ten men where a hundred are needed. Ink does the rest."
    phases:
      - { skills: [pv-compare, pv-times-ten], count: 3, taunt: "Which report is bigger? Are you SURE? I wrote both." }
      - { skills: [pv-regroup, pv-shift], count: 3, taunt: "Thirty-four thousand arrows. Or is it thirty-four hundred? So easy to confuse." }
      - { skills: [pv-numberline, pv-compare], count: 3, taunt: "I moved the milestones, too. Did you notice? Nobody ever notices." }
    defeat: "*Vane's quill snaps. He looks at the ledgers, at you, and shrugs.* 'Fine. You can count. That only makes you a better target.' *He is gone before the smoke clears.*"

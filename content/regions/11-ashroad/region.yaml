- rank: 3
  story: ashroad-r3
  boss:
    name: The Ash-Hand
    hue: 20
    intro:
    - My master forged numbers. I forge commands. Armies march where I write.
    - One flick of ash and a hundred becomes a thousand. Are you sure of your places?
    taunts:
    - Ten times? A hundred times? The ash decides.
    - Regroup the soldiers. Regroup the tens. Regroup them WRONG.
    - Every milestone on this road is a little bit of a lie.
    - ASH AND ORDERS.
    defeat: The ash cools. My hand… is just a hand. I think I would like to be a baker now.

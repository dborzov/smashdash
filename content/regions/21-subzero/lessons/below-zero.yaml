id: below-zero
title: Below Zero
skill: neg-numbers
beats:
  - type: say
    who: grimble
    text: >-
      Numbers don't stop at zero. Keep going left on the number line and you get **negative
      numbers**: $-1$, $-2$, $-3$… Think of temperatures below freezing, or floors below the
      ground in a lift.
  - type: show
    widget: { kind: numberline, min: -10, max: 10, step: 5, minor: 1, labels: all, arrow: -6 }
    text: "The arrow is at $-6$: six steps **left** of zero."
  - type: input
    who: grimble
    text: The springs' thermometer has an arrow on it. What does it say?
    widget: { kind: numberline, min: -10, max: 10, step: 5, minor: 1, labels: all, arrow: -3 }
    answer: -3
    atom: read
    nudges:
      - { value: 3, text: "It's on the **cold** side of zero, the left. That's minus 3. (Use the − key!)" }
    explain: "Three steps left of zero: $-3$."
  - type: say
    who: grimble
    text: >-
      Here's the bit that trips everyone up. **$-7$ is smaller than $-2$.** Seven is bigger than two,
      but minus seven is further below zero. Colder. Deeper. Smaller.
  - type: ask
    who: grimble
    text: "Which is colder: $-8$ °C or $-3$ °C?"
    options: ['$-8$ °C', '$-3$ °C']
    correct: 0
    atom: compare
    nudges:
      "1": "3 is smaller than 8, but $-3$ is closer to zero — warmer. $-8$ is further down."
    explain: "$-8 < -3$. Further below zero is colder."
  - type: order
    who: grimble
    text: Put these depths in order, deepest (smallest) first.
    items: ['$-2$', '$5$', '$-9$', '$0$']
    correct: [2, 0, 3, 1]
    direction: smallest → largest
    atom: order
    traps:
      - { order: [3, 0, 1, 2], text: "You sorted by size ignoring the minus! $-9$ is the smallest of all." }
    explain: "$-9 < -2 < 0 < 5$."
  - type: input
    who: grimble
    text: "It was $-4$ °C at dawn and $6$ °C by lunch. How many degrees warmer did it get?"
    answer: 10
    atom: gap
    nudges:
      - { value: 2, text: "Up from $-4$ to zero is 4 degrees, then 6 more." }
    explain: "4 degrees up to zero, 6 more after: 10."
  - type: practice
    skill: neg-numbers
    count: 4

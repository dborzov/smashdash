id: subzero-r2
title: "Heroic: The Ice Armada"
beats:
  - type: say
    who: grimble
    text: >-
      **Heroic** Subzero Springs. The Admiral's back, with a fleet of icebergs, and he's hired
      the Muddler's intern to "check" your answers. The intern is very keen. The intern is very wrong.
  - type: say
    who: intern
    text: >-
      Hi! I'm the intern! I'll be answering first and you tell me if I'm right! I'm doing GREAT so far!
      I think! What's a negative?
  - type: input
    who: grimble
    text: "The Admiral's fleet: 17 icebergs, minus the one that melted, minus 3 more that sank. How many left?"
    answer: 13
    nudges:
      - { value: 21, text: "Melting and sinking take icebergs away." }
    explain: "$17 - 1 - 3 = 13$. Still a lot of icebergs for one penguin."

id: balloons-and-sandbags
title: Balloons and Sandbags
skill: neg-add
beats:
  - type: say
    who: grimble
    text: >-
      To get across the frozen canyon we're taking a hot-air balloon. Every **balloon** lifts us
      up 1. Every **sandbag** pulls us down 1. Our height is the number.
  - type: play
    who: grimble
    text: Have a play. Add balloons, add sandbags, pop some, drop some. Watch the height.
    widget: { kind: balloon, start: 0 }
    done: "Balloons are $+1$, sandbags are $-1$. A balloon and a sandbag together? They cancel: a **zero pair**."
  - type: play
    who: grimble
    text: "Now: $2 + (-5)$. Start at 2 and **add** 5 sandbags."
    widget: { kind: balloon, start: 2, op: add, k: -5 }
    done: "Adding sandbags pulls you down: $2 + (-5) = -3$."
  - type: say
    who: muddler
    text: >-
      HA! And what about SUBTRACTING a negative? $1 - (-3)$? You can't take away a minus! It's
      impossible! It's DARK MAGIC!
  - type: say
    who: grimble
    text: >-
      Subtracting means **taking away**. Taking away $-3$ means taking away three sandbags. What
      happens to a balloon when you throw sandbags overboard?
  - type: play
    who: grimble
    text: "Do $1 - (-3)$: start at 1… and take away 3 sandbags. (No sandbags to take? Add zero pairs first!)"
    widget: { kind: balloon, start: 1, op: sub, k: -3 }
    done: "Taking away sandbags lifts you UP: $1 - (-3) = 4$. Minus a minus is a plus — and now you can SEE why."
  - type: input
    who: grimble
    text: "Your turn, no balloon: $-2 - (-6)$?"
    answer: 4
    atom: sub-neg
    nudges:
      - { value: -8, text: "Subtracting $-6$ means throwing away 6 sandbags. Up you go!" }
      - { value: -4, text: "Right size, wrong side. Throwing sandbags away lifts you: from $-2$ up 6." }
    explain: "$-2 - (-6) = -2 + 6 = 4$."
  - type: input
    who: grimble
    text: "And $-3 - 4$?"
    answer: -7
    atom: sub-pos
    nudges:
      - { value: 1, text: "Taking away 4 balloons sends you DOWN from $-3$." }
      - { value: 7, text: "Right size, but you're below zero." }
    explain: "From $-3$, down 4 more: $-7$."
  - type: practice
    skill: neg-add
    count: 4

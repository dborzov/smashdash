    title: The Ledger Wraith
    monster: { name: The Ledger Wraith, seed: 3, hue: 195, art: wraith }
    intro:
      - "*The ashes of the Ledger Hall lift off the floor and fold themselves into a shape. Burnt pages for skin. Two cold lights for eyes.*"
      - "I AM EVERY COUNT YOU LOST. Every name, every sack, every soldier you can no longer number. Read me wrong, Reckoner, and I take them all."
    phases:
      - { skills: [pv-places, pv-value], count: 3, taunt: "Which place? Which worth? You squint at digits like a child at stars." }
      - { skills: [pv-read, pv-write], count: 3, taunt: "Two million, forty thousand, six. Write it, if you can hold the zeros." }
      - { skills: [pv-expanded, pv-write], count: 3, taunt: "Break me apart, then. Every piece. Miss one and I come back." }
    defeat: "*The wraith comes apart page by page. Each page lands face up, and every number on it is readable again.*"
ranks:
- rank: 2
  story: greyhaven-r2
  boss:
    name: The Ledger Wraith, Rewritten
    intro:
    - You thought I was ink and nothing more. Someone has written me again. In red.
    - Every place you count, I have shifted by one. Can you feel the city slipping?
    taunts:
    - Ten thousand. One hundred thousand. What is a zero between friends?
    - Which place? Which worth? You squint at me like a page in the dark.
    - Write it, if you can hold all the zeros at once.
    - THE RED LEDGER OPENS.
    defeat: Red ink runs. Grey ink fades. And the city keeps its count. For now.

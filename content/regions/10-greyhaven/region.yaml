- rank: 3
  story: greyhaven-r3
  boss:
    name: The First Clerk
    hue: 0
    intro:
    - I wrote the first false number in the March. It was very small. It grew.
    - Every lie you have fought began on my desk. Sit. Let us count together. I will lie; you will try
      to catch me.
    taunts:
    - A million is just a thousand thousands. Or a hundred thousands. Who checks?
    - The seven is worth seven. Only seven. Always seven.
    - Leave the empty places empty. Nobody misses a zero.
    - THE FIRST LIE.
    defeat: "You caught every one. I have nothing left to write. Perhaps that is how it should end: with\
      \ a clean page."

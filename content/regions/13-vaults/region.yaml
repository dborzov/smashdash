  - id: boss
    type: boss
    title: The Tallyman
    monster: { name: The Tallyman, seed: 1, hue: 190, art: tallyman }
    intro:
      - "*In the deepest vault, a skeleton in a reckoner's robes sits at a desk of black glass, writing in a ledger that never ends. He does not look up.*"
      - "Aldous Crane. Royal Reckoner. That was my name, until the King struck it from his books to save a coin on my pension. A thing not counted does not exist, child. So I stopped existing. And then I started... subtracting."
      - "Your realm lives on numbers it no longer knows how to read. I will take every one of them. Unless, of course, you can out-count me."
    phases:
      - { skills: [pv-value, pv-write, round-big], count: 3, taunt: "The old counts first. Millions. Do you still remember how?" }
      - { skills: [dec-places, dec-compare], count: 3, taunt: "Smaller now. Tenths. Hundredths. The places where cheats hide their thumbs." }
      - { skills: [dec-shift, dec-round], count: 3, taunt: "Slide the point. Round the weight. One slip and the ledger is MINE." }
    defeat: "*The Tallyman's pen stops. He looks at the last page, where your name is written in a clean, correct hand.* 'Counted,' he whispers. 'I was counted.' *The bones settle, the blue light goes out, and the ledger closes by itself.*"
ranks:
- rank: 2
  story: vaults-r2
  boss:
    name: The Tallyman, Unbalanced
    intro:
    - My scales were broken. I have fixed them. Crookedly. On purpose.
    - Tenths, hundredths — I move the point when you blink.
    taunts:
    - Point three five is bigger than point four. More digits! More value!
    - Slide the point. Round the weight. One slip, and the ledger is mine.
    - Millions, then thousandths. Can you still hold them both?
    - THE SCALES TIP.
    defeat: Balanced. Again. I hate balance. It is so… honest.
  nodes:
  - id: glass-duel
    type: encounter
    title: Duel on the Glass Floor
    game: duel

    - dec-shift
    - dec-round
    count: 7
- rank: 3
  story: vaults-r3
  boss:
    name: The Assayer
    hue: 190
    intro:
    - I weigh in thousandths. Every coin I touched was a whisker light. Nobody noticed. For forty years.
    - You may test me. I have tested better.
    taunts:
    - Two point four six eight. Round it down. Always down. My way.
    - "Which is heavier: point oh nine or point one? Think carefully."
    - Divide by a thousand. Lose a little on the way. Nobody counts the crumbs.
    - THE FINE PRINT.
    defeat: You noticed. After forty years, someone noticed. I suppose I should give the crumbs back.

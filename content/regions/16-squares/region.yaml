id: squares
order: 16
name: The Hall of Squares
tagline: A hall where every room is square, every tile is square, and the monster has a perfectly square grid of eyes.
campaign: tables
topic: 'Square numbers, breaking hard facts into easy ones ($7 \times 8 = 7 \times 7 + 7$), and division as the reverse'
added: '2026-10-17'
scene: squarehall
map: { x: 62, y: 66 }
requires: [doubling]
palette: { sky: ["#1a0a2e", "#6a2a8a"], accent: "#ff7ab8", ground: "#2e1a46" }
outro: squares-outro
monsters:
  - { name: Square Slime, seed: 161, hue: 300, taunts: ["I'm a square! A squishy square!", "Four sides! Four corners! Zero friends!"] }
  - { name: Tile Golem, seed: 162, hue: 270, taunts: ["I am made of 49 tiles. Seven by seven. Count me. COUNT ME.", "Crunch."] }
  - { name: Eyeball Imp, seed: 163, hue: 330, taunts: ["I see you! With all four eyes!", "Blink. Blink. Blink. Blink."] }
path:
  - id: intro
    type: story
    title: The Square Door
    lesson: squares-intro
  - id: perfect-squares
    type: lesson
    title: Perfect Squares
    lesson: perfect-squares

    game: battle
    skills: [square-nums]
    count: 5
    monster: { name: Tile Golem, seed: 162, hue: 270, taunts: ["Crunch.", "Seven by seven. Count me!"] }
  - id: break-it-down
    type: lesson
    title: Break It Down
    lesson: break-it-down
  - id: square-chest
    type: encounter
    title: The Square Chest
    game: chest

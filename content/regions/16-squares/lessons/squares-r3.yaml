id: squares-r3
title: "Legendary: The Third Dimension"
beats:
  - type: say
    who: dm
    text: >-
      **Legendary.** Okay. So squares are flat. Two dimensions. Rows and columns. But what if…
      there were LAYERS. *Dramatic music*. Barry, the music.
  - type: say
    who: barry
    text: ♪ Dun dun DUNNN! ♪
  - type: say
    who: thog
    text: >-
      Thog hear noise from cellar. Sounds like 343 eyes blinking. Thog not know why Thog know that
      number. Thog just feel it.
  - type: input
    who: dm
    text: "A cube of eyes is 7 by 7 by 7. One layer is $7 \\times 7$. How many eyes in **one** layer?"
    answer: 49
    nudges:
      - { value: 21, text: "7 rows of 7: $7 \\times 7$, not $7 + 7 + 7$." }
    explain: "One layer is 49. And there are 7 layers. That's… a lot of eyes. 343. Good thing we're heroes."

  - id: boss
    type: boss
    title: The Hydra
    monster: { name: The Hydra, seed: 1501, hue: 150, art: hydra }
    intro:
      - "HELLO. HELLO. We are the Hydra. We are three heads. We were one head this morning. Somebody tried to chop it off."
      - "Every head you knock off, two grow back. We call it HYDRA-NOMICS. Head one is good at maths. Heads two and three are not."
      - "Let's see you double faster than we do!"
    phases:
      - { skills: [doubles], count: 3, taunt: "Double! Double! Head two says 'what's double 17?' Head three says 'seventeen-seventeen'. Head three is an idiot." }
      - { skills: [fives-tens, doubles], count: 3, taunt: "Ten heads would be scary. Five heads would be half as scary. Do the maths, hero." }
      - { skills: [nines, fives-tens], count: 3, taunt: "We have nine heads now! No — eight! Nine minus one! We're confused! We're ALWAYS confused!" }
    defeat: "Ow. Ow. Ow. OK, one head is plenty. We're going to be a regular snake now. A normal, quiet snake. With a lot of feelings."
ranks:
  - rank: 2
    story: doubling-r2
    boss:
      name: The Hydra (Eight Heads)
      intro:
        - "WE'RE BACK. We doubled. Then doubled. Then doubled. Eight heads. One stomach. It's a lot of opinions."
        - "Head six wants to sing. Head seven wants a nap. All of us want to beat YOU."
      taunts:
        - "Double, double, toil and trouble — and then double that!"
        - "Five heads say 'half of ten'! The other three say 'what's ten'!"
        - "Nine times seven! Ten sevens minus one seven! We can do it now! …Can we?"
        - "EVERYTHING! ALL HEADS! ATTACK!"
      defeat: "Ow ×8. We're going back to one head. One is the loneliest number, but it's the quietest."
    nodes:
      - { id: copy-vault, type: encounter, title: The Copy Goblin's Vault, game: vault, skills: [doubles, nines], count: 6 }
  - rank: 3
    story: doubling-r3
    boss:
      name: The Hydra's Accountant
      seed: 1502
      hue: 40
      intro:
        - "Good afternoon. I represent the Hydra. All sixteen heads of it. They are suing you for emotional damage."
        - "I am also a hydra. I have two heads. One does the adding. One does the doubling. Neither does the halving. That's where you come in."
      taunts:
        - "Double the claim! Double it again! The lawyers love doubling."
        - "Five percent? No — FIFTY. Half of a hundred. Move the zeros, hero."
        - "Nine sevens is sixty-three. Our fee is sixty-three gold. That's just maths."
        - "Everything, in triplicate! Signed! Stamped! Doubled!"
      defeat: "Case dismissed. I'll tell the heads they lost. They'll argue among themselves for weeks. Good."

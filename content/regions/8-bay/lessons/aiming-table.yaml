id: aiming-table
title: The Aiming Table
skill: table-rule
beats:
  - type: say
    who: polly
    text: >-
      Inkbert's ships sail in a sneaky pattern. My old logbook says they ALWAYS follow this
      rule: $y = 2x + 3$. I don't know what it means. I just like the shapes.
  - type: say
    who: grimble
    text: >-
      That's an **aim rule**. Pick an $x$, put it in, out pops a $y$. It's our old friend from
      Bramblebottom: "if $x = 1$, what is $2x + 3$?"
  - type: input
    who: grimble
    text: If $x = 1$, what is $y$?
    math: 'y = 2x + 3'
    answer: 5
    nudges:
      - { value: 24, text: "$2x$ isn't glued digits! It means $2 \\times x$." }
      - { value: 8, text: "Multiply first, then add: $2 \\times 1 + 3$." }
      - { value: 2, text: "Don't forget the $+ 3$!" }
    explain: "$y = 2 \\times 1 + 3 = 5$. So one ship is at $(1, 5)$."
  - type: input
    who: grimble
    text: And if $x = 2$?
    math: 'y = 2x + 3'
    answer: 7
    nudges:
      - { value: 25, text: "No gluing! $2 \\times 2 + 3$." }
      - { value: 10, text: "Multiply first: $2 \\times 2 = 4$, then add 3." }
    explain: "$y = 2 \\times 2 + 3 = 7$. Another ship at $(2, 7)$."
  - type: show
    who: polly
    text: >-
      Let's keep a proper ship's log: each $x$ on top, its $y$ underneath. Every column is one
      spot on the sea.
    math: '\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\ \hline y & 3 & 5 & 7 & \box \end{array}'
  - type: input
    text: Fill in the gap in the log. What is $y$ when $x = 3$?
    math: '\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\ \hline y & 3 & 5 & 7 & \box \end{array}'
    answer: 9
    nudges:
      - { value: 8, text: "Use the rule: $2 \\times 3 + 3$." }
      - { value: 12, text: "Multiply first, then add: $2 \\times 3 = 6$, then $+ 3$." }
    explain: "$2 \\times 3 + 3 = 9$."
  - type: play
    text: >-
      Now aim the laser with the rule! For each $x$, work out $y$, then tap that spot.
    widget: { kind: plot, size: 10, rule: { m: 2, b: 3 }, targets: [0, 1, 2, 3] }
    done: >-
      Look! The four zaps sit on a perfectly straight line. That line is the **graph** of
      $y = 2x + 3$.
  - type: say
    who: grimble
    text: >-
      Every rule like $y = 2x + 3$ makes a straight line. Mathematicians call them **linear**,
      from "line". They are not a very imaginative bunch.
  - type: practice
    skill: table-rule
    count: 4

      - { skills: [table-rule, step-pattern], count: 3, taunt: "My ships follow a SECRET rule! …It's painted on the side of the ships. I should fix that." }
      - { skills: [line-rule, table-rule], count: 3, taunt: "Behold my mighty beam of FOG! Why are you reading its rule?! STOP THAT!" }
    defeat: "Blorp… okay, okay. I'll go back to the deep. I only came up because it's lonely down there. …Can I visit on Sundays?"

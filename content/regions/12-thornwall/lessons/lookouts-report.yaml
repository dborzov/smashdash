id: lookouts-report
title: The Lookout's Report
skill: round-big
beats:
  - type: say
    who: wren
    text: >-
      Same rule, bigger numbers. My count of the eastern camp: **4,372,519**. The Marshal wants it
      to the nearest hundred thousand.
  - type: show
    who: wren
    text: "The hundred-thousands digit is **3**. The very next digit is **7**: 5 or more."
    widget: { kind: placechart, value: 4372519, hl: 5 }
  - type: input
    who: voss
    text: Round **4,372,519** to the nearest hundred thousand.
    answer: 4400000
    atom: r100k
    nudges:
      - { value: 4300000, text: "The next digit is 7 — round **up**." }
      - { value: 44, text: "Keep the zeros. Rounding doesn't shrink the number." }
      - { value: 4370000, text: "That's the nearest ten thousand. One place further left." }
    explain: "3 hundred-thousands, next digit 7 → up: **4,400,000**."
  - type: input
    who: voss
    text: And to the nearest **million**?
    answer: 4000000
    atom: r1m
    nudges:
      - { value: 5000000, text: "Look only at the digit right after the millions: 3. Less than 5." }
    explain: "Millions digit 4, next digit 3 → keep it: **4,000,000**."
  - type: say
    who: voss
    text: >-
      Different questions need different roundings. "Nearest million" tells me whether to send for
      the King's army. "Nearest ten thousand" tells Hobb how many arrows to hand out.
  - type: input
    who: hobb
    text: Round **1,965,000** to the nearest ten thousand.
    answer: 1970000
    atom: half
    nudges:
      - { value: 1960000, text: "The next digit is 5 — exactly halfway rounds up." }
    explain: "Ten-thousands digit 6, next digit 5 → up: **1,970,000**."
  - type: input
    who: wren
    text: Round **2,996,400** to the nearest ten thousand.
    answer: 3000000
    atom: nines
    nudges:
      - { value: 2900000, text: "The 9 ten-thousands become 10 — carry into the hundred-thousands, and then the millions!" }
      - { value: 2990000, text: "The next digit is 6 — round **up**." }
    explain: "99 ten-thousands + 1 = 100 ten-thousands = 1,000,000 more: **3,000,000**."
  - type: practice
    skill: round-big
    count: 4

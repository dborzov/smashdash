id: about-how-many
title: About How Many?
skill: round-small
beats:
  - type: say
    who: wren
    text: >-
      Rounding asks: which round number is this closest to? Take 4,372, to the nearest hundred.
      It's somewhere between 4,300 and 4,400. Which one is it nearer?
  - type: play
    who: wren
    text: Zoom in. Is 4,372 nearer 4,300 or 4,400?
    widget: { kind: rounder, value: 4372, place: 2 }
    done: "4,372 is past the halfway mark (4,350), so it rounds **up** to 4,400."
  - type: say
    who: voss
    text: >-
      The rule, short enough to remember in a fight: find the place you're rounding to. Look at
      **the very next digit** — only that one. 5 or more: round up. Less than 5: keep it. Everything
      after becomes zeros.
  - type: input
    who: voss
    text: Round **6,835** to the nearest hundred.
    answer: 6800
    atom: r100
    nudges:
      - { value: 6900, text: "The digit right after the hundreds is 3 — less than 5. Keep the 8." }
      - { value: 68, text: "Keep the zeros! Rounding gives a number of the same size." }
      - { value: 6840, text: "That's to the nearest ten. We want the nearest hundred." }
    explain: "Hundreds digit 8, next digit 3 → keep it: **6,800**."
  - type: input
    who: wren
    text: Round **2,650** to the nearest hundred.
    answer: 2700
    atom: half
    nudges:
      - { value: 2600, text: "Exactly halfway counts as up. That's the rule every scout uses, so everyone agrees." }
    explain: "Next digit is 5 → round up: **2,700**."
  - type: play
    who: hobb
    text: Now a nasty one. Round 9,960 to the nearest hundred.
    widget: { kind: rounder, value: 9960, place: 2 }
    done: "9,960 is much nearer 10,000. When the 9 rounds up it carries: 99 hundreds + 1 = 100 hundreds = 10,000."
  - type: input
    who: hobb
    text: Round **7,982** to the nearest hundred.
    answer: 8000
    atom: nines
    nudges:
      - { value: 7000, text: "The 9 hundreds become 10 hundreds — that's a whole thousand. Carry it!" }
      - { value: 7900, text: "The next digit is 8 — round **up**." }
    explain: "Next digit 8 → up. 9 hundreds + 1 = 10 hundreds = 1 thousand: **8,000**."
  - type: input
    who: voss
    text: Round **3,449** to the nearest thousand.
    answer: 3000
    atom: r1000
    nudges:
      - { value: 4000, text: "Don't round in a chain (3,449 → 3,450 → 3,500 → 4,000)! Look only at the digit right after the thousands: 4." }
      - { value: 3400, text: "That's the nearest hundred. Nearest thousand: look at the hundreds digit." }
    explain: "Thousands digit 3, next digit 4 → keep it: **3,000**."
  - type: practice
    skill: round-small
    count: 4

id: quick-reckoning
title: Quick Reckoning
skill: estimate
beats:
  - type: say
    who: hobb
    text: >-
      In a siege there's no time for long sums. Three companies: 4,870, 5,120 and 2,990 soldiers.
      About how many altogether? Round each one first, then add. Easy numbers, fast answer.
  - type: show
    who: hobb
    math: '4{,}870 + 5{,}120 + 2{,}990 \approx 5{,}000 + 5{,}000 + 3{,}000 = 13{,}000'
  - type: input
    who: hobb
    text: Estimate $3{,}210 + 6{,}780$ by rounding each to the nearest thousand first.
    answer: 10000
    atom: sum
    nudges:
      - { value: 9990, text: "That's the exact answer. An estimate rounds **first**: 3,000 + 7,000." }
      - { value: 9000, text: "Round, don't chop: 6,780 rounds up to 7,000." }
    explain: "$3{,}000 + 7{,}000 = 10{,}000$."
  - type: say
    who: voss
    text: >-
      Here's the real use. A clerk once told me those three companies made 1,298 soldiers. My
      estimate said about 13,000. Somebody had dropped a place. Estimates catch slipped digits.
  - type: ask
    who: voss
    text: A clerk adds $21{,}940 + 38{,}200$ and writes **601,400**. Could that be right?
    options:
      - "No — the estimate is about 60,000, so it's ten times too big"
      - "Yes — it's close enough"
      - "No — it should be about 6,000"
    correct: 0
    atom: check
    nudges:
      "1": "Estimate: 22,000 + 38,000 = 60,000. Is 601,400 anywhere near?"
      "2": "Check the estimate again: 22,000 + 38,000."
    explain: "About 22,000 + 38,000 = 60,000. The clerk's 601,400 has an extra place — ten times too big."
  - type: input
    who: wren
    text: Estimate $8{,}240 - 3{,}870$, rounding each to the nearest thousand first.
    answer: 4000
    atom: difference
    nudges:
      - { value: 4370, text: "That's the exact answer. Round first: 8,000 − 4,000." }
      - { value: 5000, text: "Round, don't chop: 3,870 rounds up to 4,000." }
    explain: "$8{,}000 - 4{,}000 = 4{,}000$."
  - type: ask
    who: voss
    text: >-
      The east gate can hold off about 12,000. Two companies of 6,815 and 7,492 are coming at
      it. Is that more or less than it can hold?
    options:
      - More — the gate needs help
      - Less — the gate will hold
    correct: 0
    atom: compare-est
    nudges:
      "1": "Estimate: 7,000 + 7,000 = 14,000. Compare with 12,000."
    explain: "About 7,000 + 7,000 = 14,000 — more than 12,000. Send help."
  - type: practice
    skill: estimate
    count: 4

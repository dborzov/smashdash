id: dragon-locks
title: The Dragon Locks
skill: two-step
beats:
  - type: narrate
    text: >-
      A gate of solid ice blocks the path. Carved into it, glowing red: $4x + 3 = 23$.
  - type: say
    who: grimble
    text: "Full solve. Two moves, both sides each time. Watch closely:"
  - type: show
    math: '\begin{aligned} 4x + 3 &= 23 \\ 4x + 3 \hl{\,- 3} &= 23 \hl{\,- 3} \\ 4x &= 20 \\ \frac{4x}{\hl{4}} &= \frac{20}{\hl{4}} \\ x &= 5 \end{aligned}'
    text: "Peel off the $+3$, then split into 4."
  - type: play
    who: grimble
    text: >-
      Same lock, on my slate. Tap **Next step** and watch which layer comes off first — and
      what happens to **both** sides each time.
    widget: { kind: eqcanvas, mode: solve, equation: '4x+3=23', demo: true }
    done: "And the slate checks it for us: $4 \\times 5 + 3 = 23$ ✓. Dragon-proof."
  - type: say
    who: grimble
    text: >-
      Now you. Try dividing first if you're feeling brave — the slate will show you exactly
      why that's a mess. Then undo it and do it properly.
  - type: play
    who: snowbert
    text: "This gate says: solve $2x + 5 = 17$."
    widget: { kind: eqcanvas, mode: solve, equation: '2x+5=17' }
    done: "Click-clunk. The gate swings open."
  - type: play
    who: snowbert
    text: "This one: solve $3x - 4 = 11$."
    widget: { kind: eqcanvas, mode: solve, equation: '3x-4=11' }
    done: "The $-4$ came off with a $+4$, then three boxes split three ways."
  - type: play
    who: snowbert
    text: "And my cave door: solve $\\frac{x}{3} + 2 = 6$."
    widget: { kind: eqcanvas, mode: solve, equation: 'x/3+2=6' }
    done: "Peel off the $+2$, then glue the thirds back together: $x = 12$."
  - type: say
    who: snowbert
    text: My cave! My beautiful cave! I can finally sleep in my own bed! It's also made of snow, but it's MY snow.
  - type: practice
    skill: two-step
    count: 5

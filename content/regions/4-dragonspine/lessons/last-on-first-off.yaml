id: last-on-first-off
title: Last On, First Off
skill: undo-order
beats:
  - type: say
    who: grimble
    text: >-
      A two-step equation is a box wrapped twice. To build $3x + 5$, you take the box,
      **multiply** by 3, then **add** 5. To unwrap it, go **backwards**: undo the $+5$ first,
      then the $\times 3$.
  - type: say
    who: grimble
    text: >-
      Think of socks and shoes. Socks go on first, then shoes. Taking them off? Shoes first.
      Last on, first off. (Unless you're a goblin. Goblins don't believe in socks. Or
      washing.)
  - type: play
    text: "Unwrap the box. Tap the **outside** layer first!"
    widget: { kind: unwrap, layers: ['\times 3', '+ 5'], value: 4 }
    done: "Unwrapped! The $+5$ came off first, then the $\\times 3$. Last on, first off."
  - type: ask
    who: snowbert
    text: What's the first move for $2x + 7 = 19$?
    math: 2x + 7 = 19
    options:
      - "Subtract 7 from both sides"
      - "Divide both sides by 2"
    correct: 0
    nudges:
      "1": "Then you'd have to divide the 7 too — messy! The $+7$ went on last, so it comes off first."
    explain: "The $+7$ is the outer layer. Subtract 7 first: $2x = 12$. Then divide by 2: $x = 6$."
  - type: ask
    who: snowbert
    text: What's the first move for $\frac{x}{4} - 1 = 3$?
    math: '\frac{x}{4} - 1 = 3'
    options:
      - "Add 1 to both sides"
      - "Multiply both sides by 4"
    correct: 0
    nudges:
      "1": "Multiplying first would multiply the 1 as well. Peel off the $-1$ first!"
    explain: "The $-1$ is the outer layer. Add 1 first: $\\frac{x}{4} = 4$. Then multiply by 4: $x = 16$."
  - type: say
    who: grimble
    text: >-
      But watch out! **Brackets flip the order.** In $2(x + 3)$ the adding happens first,
      inside the VIP room — so the $\times 2$ is the outer layer. Undo it first!
  - type: play
    text: "This box is wrapped as $2(x + 3)$. Unwrap it!"
    widget: { kind: unwrap, layers: ['+ 3', '\times 2'], value: 5 }
    done: "The $\\times 2$ was the outer layer, so it came off first."
  - type: ask
    who: grimble
    text: What's the first move for $5(x - 2) = 15$?
    math: 5(x - 2) = 15
    options:
      - "Divide both sides by 5"
      - "Add 2 to both sides"
    correct: 0
    nudges:
      "1": "The brackets protect the $-2$! The $\\times 5$ is outside, so undo it first."
    explain: "The $\\times 5$ is outside the brackets. Divide by 5: $x - 2 = 3$. Then add 2: $x = 5$."
  - type: practice
    skill: undo-order
    count: 4

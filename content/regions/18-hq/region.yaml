    count: 7
  - id: boss
    type: boss
    title: The Unit Confuser
    monster: { name: The Unit Confuser, seed: 1801, hue: 30, art: confuser }
    intro:
      - "Mwahaha! I am the UNIT CONFUSER! I have swapped every millimetre in this city for a kilometre!"
      - "The Mayor ordered a 2-metre statue. He's getting a 2-KILOMETRE statue. It's on its way. It's blocking the sun."
      - "Doctor Exactly pays me by the unit. Which unit? NOBODY KNOWS!"
    phases:
      - { skills: [size-sense], count: 3, taunt: "Is a whale 27 metres or 27 millimetres? Think how cute a 27-millimetre whale would be!" }
      - { skills: [zoom-levels, size-sense], count: 3, taunt: "Ten to the four! Ten to the forty! What's the difference? (Thirty-six zooms. Don't tell anyone.)" }
      - { skills: [unit-hop, zoom-levels], count: 3, taunt: "One kilogram is one gram! One kilometre is one metre! KILO IS JUST A WORD!" }
    defeat: "Nooo! You put the units back! The statue is shrinking! It's… 2 metres. It's quite nice actually."
ranks:
  - rank: 2
    story: hq-r2
    boss:
      name: The Unit Confuser (Imperial Edition)
      intro:
        - "I'm back! And this time I've brought FEET. And INCHES. And a FURLONG. Nobody knows what a furlong is!"
        - "…Fine, the website says metric only. I'll just confuse your metric HARDER."
      taunts:
        - "A flea is the size of a bus! A bus is the size of a flea! Ha!"
        - "Ten to the nine or ten to the six? Three zooms? Who's counting? (You. You're counting.)"
        - "A thousand grams in a kilogram? I say it's a hundred! And I say it LOUDLY!"
        - "ALL THE UNITS AT ONCE! Millikilometres! Centigrams-per-furlong!"
      defeat: "Curses! Measured, and found wanting. Exactly 1.4 metres of wanting."
    nodes:
      - { id: gremlin-vault, type: encounter, title: The Gremlin's Vault, game: vault, skills: [unit-hop, size-sense], count: 6 }
  - rank: 3
    story: hq-r3
    boss:
      name: The Unit Confuser's Evil Twin, Bob
      hue: 280
      intro:
        - "I'm Bob. The Unit Confuser's evil twin. Yes, he was already evil. I'm evil-er. By about a factor of ten."
        - "I don't confuse units. I confuse ZEROS. Ten thousand? Or ten million? Mwahaha. Mwahahahahaha. That's three more ha's."
      taunts:
        - "An ant is a hundred metres long! A mountain fits in your pocket!"
        - "Ten to the five, ten to the seven, same thing really!"
        - "Kilo, mega, giga, whatever!"
        - "ALL OF THEM! Take THAT, intern!"
      defeat: "Hmm. You really know your zeros. Fine. I'll go and confuse something easier. Like Thursdays."
treasures:
  - { item: hero-bar, rank: 2 }
  - { item: zoom-lens, rank: 3 }
  - { item: star-mask, flawless: 5 }

topic: 'How big things are, from atoms to galaxies: powers of ten, zoom levels and units'
added: '2026-10-17'
scene: hq
map: { x: 22, y: 60 }
requires: []
palette: { sky: ["#0a1a3a", "#2b6ad6"], accent: "#5ec8ff", ground: "#1a2a4a" }
outro: hq-outro
monsters:

  - { name: Henchbot 3000, seed: 182, hue: 190, taunts: ["BEEP. YOUR SIZE IS: WRONG. BEEP.", "I AM 3,000 TIMES BETTER. OR 3. ROUNDING."] }
  - { name: Ruler Gremlin, seed: 183, hue: 40, taunts: ["Is it 3 cm or 3 km? WHO CARES! Hee hee!", "I eat millimetres for breakfast!"] }

id: lilypad-hop
title: Lily Pad Hop
skill: one-step-add
beats:
  - type: say
    who: grimble
    text: >-
      To **solve** an equation means to find what's in the box. The method: get the box alone,
      and whatever you do to one side, do to the other. You already know both halves!
  - type: show
    who: grimble
    text: "The box has $+8$ stuck to it. Subtract 8 from both sides:"
    math: '\begin{aligned} x + 8 &= 15 \\ x + 8 \hl{\,- 8} &= 15 \hl{\,- 8} \\ x &= 7 \end{aligned}'
  - type: play
    who: grimble
    text: >-
      Now on my slate, so you can see every move. Keep tapping **Next step**. Watch the move
      get written into **both** sides — and watch the $+8$ and $-8$ cancel. Poof.
    widget: { kind: eqcanvas, mode: solve, equation: 'x+8=15', demo: true }
    done: "That's the whole trick: same move on both sides, then tidy up. Every line written down."
  - type: say
    who: grimble
    text: >-
      Your turn. Pick a move (**+ − × ÷**), pick a number, and do it to both sides. Then work
      out the sums. If you pick a silly move, the slate will tell you — and let you undo it.
  - type: play
    who: nettle
    text: "This lily pad says: solve $x + 6 = 11$."
    widget: { kind: eqcanvas, mode: solve, equation: 'x+6=11' }
    done: "Five! Gerald the tadpole nods. He doesn't have a neck, so it's more of a wobble."
  - type: say
    who: grimble
    text: When the box has a **minus** stuck to it, we **add** to undo it.
  - type: play
    who: nettle
    text: "Next pad: solve $x - 4 = 9$."
    widget: { kind: eqcanvas, mode: solve, equation: 'x-4=9' }
    done: "Thirteen. The $-4$ and $+4$ cancelled, and the box stood alone."
  - type: say
    who: grimble
    text: >-
      One more trick. The box doesn't have to be on the left. $12 = x + 3$ is the same scale,
      just looked at from the other side of the swamp.
  - type: play
    who: nettle
    text: "Last pad: solve $12 = x + 3$."
    widget: { kind: eqcanvas, mode: solve, equation: '12=x+3' }
    done: "$9 = x$ is the same as $x = 9$. The scale doesn't care which pan the box sits on."
  - type: practice
    skill: one-step-add
    count: 4
  - type: say
    who: nettle
    text: Heh! Not a single splash. Gerald is impressed. That's rare. He's a tadpole.

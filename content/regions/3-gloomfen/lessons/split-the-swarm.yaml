id: split-the-swarm
title: Split the Swarm
skill: one-step-mul
beats:
  - type: say
    who: nettle
    text: >-
      My fireflies have split into 4 swarms, dearie. 28 fireflies in all, same number in each
      swarm. How many per swarm? I need to know who to scold.
  - type: say
    who: grimble
    text: >-
      Four boxes, each hiding the same number, weigh 28. That's $4x = 28$. The box is being
      **multiplied** by 4 — so undo it by **dividing** both sides by 4.
  - type: show
    math: '\begin{aligned} 4x &= 28 \\ \frac{4x}{\hl{4}} &= \frac{28}{\hl{4}} \\ x &= 7 \end{aligned}'
    text: "Seven fireflies per swarm."
  - type: play
    who: grimble
    text: "Solve $3x = 21$ on the slate. Three boxes… what undoes **times** 3?"
    widget: { kind: eqcanvas, mode: solve, equation: '3x=21' }
    done: "$\\frac{3x}{3}$ is one box, and $\\frac{21}{3} = 7$. Divide undoes times."
  - type: say
    who: grimble
    text: >-
      And if the box is being **divided**, multiply to undo. $\frac{x}{5} = 4$ means "a fifth
      of the box is 4", so the whole box is $4 \times 5 = 20$.
  - type: play
    who: nettle
    text: "Solve $\\frac{x}{2} = 9$. The box is cut in half. Glue it back together!"
    widget: { kind: eqcanvas, mode: solve, equation: 'x/2=9' }
    done: "Half the box is 9, so the whole box is 18. Times undoes divide."
  - type: practice
    skill: one-step-mul
    count: 4

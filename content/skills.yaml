# Every atomic skill in the game. Each id needs a generator in src/skills/index.ts.
# In the game, skills are shown as "spells" in the hero's Spellbook.
# `region` is where the skill is taught. See docs/learning-design.md for the skill graph.

- id: notation
  name: Box Talk
  region: bramblebottom
  icon: "🗣️"
  summary: "Read the language of boxes: 3x means 3 × x, x/4 means x split into 4."
- id: eval-one
  name: Box Opener
  region: bramblebottom
  icon: "📦"
  summary: "If x = 4, what is 3x? Swap the box for its number."
- id: eval-two
  name: Double Lock
  region: bramblebottom
  icon: "🔐"
  summary: "If x = 4, what is 3x + 7? Multiply first, add last."
- id: eval-parens
  name: Bracket Breaker
  region: bramblebottom
  icon: "🧱"
  summary: "Brackets go first: 2(x + 3) is not 2x + 3."
- id: words-to-expr
  name: Goblin Translator
  region: bramblebottom
  icon: "👺"
  summary: "Turn words into maths: '3 less than x' is x − 3."

- id: balance-rule
  name: Scale Sense
  region: ironhold
  icon: "⚖️"
  summary: "Same thing to both sides keeps the balance."
- id: both-sides
  name: Ledger Keeper
  region: ironhold
  icon: "📒"
  summary: "Apply a move to both sides of an equation and write the result."
- id: inverse-ops
  name: Undo Spell
  region: ironhold
  icon: "↩️"
  summary: "+ undoes −, × undoes ÷, and the other way round."
- id: pick-move
  name: Right Hammer
  region: ironhold
  icon: "🔨"
  summary: "Pick the move that gets x alone."

- id: one-step-add
  name: Lily Hopper
  region: gloomfen
  icon: "🪷"
  summary: "Solve x + 8 = 15 and x − 4 = 9."
- id: one-step-mul
  name: Swarm Splitter
  region: gloomfen
  icon: "✨"
  summary: "Solve 4x = 28 and x/5 = 4."
- id: check-solution
  name: Truth Seer
  region: gloomfen
  icon: "🔍"
  summary: "Check an answer by putting it back in the box."

- id: undo-order
  name: Unwrapper
  region: dragonspine
  icon: "🎁"
  summary: "Last on, first off: which move comes first in a two-step equation."
- id: two-step
  name: Dragon Lock
  region: dragonspine
  icon: "🐉"
  summary: "Solve 3x + 5 = 20 in two moves."

- id: name-unknown
  name: Mystery Finder
  region: bazaar
  icon: "❓"
  summary: "In a story problem, decide what x stands for."
- id: story-to-equation
  name: Riddle Writer
  region: bazaar
  icon: "📜"
  summary: "Turn a story into an equation."
- id: story-solve
  name: Riddle Cracker
  region: bazaar
  icon: "🦁"
  summary: "Solve story problems and answer the real question."

- id: power-meaning
  name: Repeat Spell
  region: tower
  icon: "🔁"
  summary: "2³ means 2 × 2 × 2, not 2 × 3."
- id: pow10-up
  name: Growing Potion
  region: tower
  icon: "🧪"
  summary: "10ⁿ is a 1 with n zeros."
- id: pow10-down
  name: Shrinking Potion
  region: tower
  icon: "🔬"
  summary: "10⁻³ = 0.001: negative powers make things tiny, not negative."
- id: times-pow10
  name: Decimal Hop
  region: tower
  icon: "🦘"
  summary: "3.2 × 10³: hop the decimal point."
- id: sci-notation
  name: Giant Scribe
  region: tower
  icon: "🔭"
  summary: "Read, write and compare numbers like 4.5 × 10⁶."

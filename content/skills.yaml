# Every atomic skill in the game. Each id needs a generator in src/skills/index.ts.
# In the game, skills are shown as "spells" in the hero's Spellbook.
# `region` is where the skill is taught. See docs/learning-design.md for the skill graph.

- id: notation
  name: Box Talk
  region: bramblebottom
  icon: "🗣️"
  summary: "Read the language of boxes: 3x means 3 × x, x/4 means x split into 4."
- id: eval-one
  name: Box Opener
  region: bramblebottom
  icon: "📦"
  summary: "If x = 4, what is 3x? Swap the box for its number."
- id: eval-two
  name: Double Lock
  region: bramblebottom
  icon: "🔐"
  summary: "If x = 4, what is 3x + 7? Multiply first, add last."
- id: eval-parens
  name: Bracket Breaker
  region: bramblebottom
  icon: "🧱"
  summary: "Brackets go first: 2(x + 3) is not 2x + 3."
- id: words-to-expr
  name: Goblin Translator
  region: bramblebottom
  icon: "👺"
  summary: "Turn words into maths: '3 less than x' is x − 3."

- id: balance-rule
  name: Scale Sense
  region: ironhold
  icon: "⚖️"
  summary: "Same thing to both sides keeps the balance."
- id: both-sides
  name: Ledger Keeper
  region: ironhold
  icon: "📒"
  summary: "Apply a move to both sides of an equation and write the result."
- id: inverse-ops
  name: Undo Spell
  region: ironhold
  icon: "↩️"
  summary: "+ undoes −, × undoes ÷, and the other way round."
- id: pick-move
  name: Right Hammer
  region: ironhold
  icon: "🔨"
  summary: "Pick the move that gets x alone."

- id: one-step-add
  name: Lily Hopper
  region: gloomfen
  icon: "🪷"
  summary: "Solve x + 8 = 15 and x − 4 = 9."
- id: one-step-mul
  name: Swarm Splitter
  region: gloomfen
  icon: "✨"
  summary: "Solve 4x = 28 and x/5 = 4."
- id: check-solution
  name: Truth Seer
  region: gloomfen
  icon: "🔍"
  summary: "Check an answer by putting it back in the box."

- id: undo-order
  name: Unwrapper
  region: dragonspine
  icon: "🎁"
  summary: "Last on, first off: which move comes first in a two-step equation."
- id: two-step
  name: Dragon Lock
  region: dragonspine
  icon: "🐉"
  summary: "Solve 3x + 5 = 20 in two moves."

- id: name-unknown
  name: Mystery Finder
  region: bazaar
  icon: "❓"
  summary: "In a story problem, decide what x stands for."
- id: story-to-equation
  name: Riddle Writer
  region: bazaar
  icon: "📜"
  summary: "Turn a story into an equation."
- id: story-solve
  name: Riddle Cracker
  region: bazaar
  icon: "🦁"
  summary: "Solve story problems and answer the real question."

- id: power-meaning
  name: Repeat Spell
  region: tower
  icon: "🔁"
  summary: "2³ means 2 × 2 × 2, not 2 × 3."
- id: pow10-up
  name: Growing Potion
  region: tower
  icon: "🧪"
  summary: "10ⁿ is a 1 with n zeros."
- id: pow10-down
  name: Shrinking Potion
  region: tower
  icon: "🔬"
  summary: "10⁻³ = 0.001: negative powers make things tiny, not negative."
- id: times-pow10
  name: Decimal Hop
  region: tower
  icon: "🦘"
  summary: "3.2 × 10³: hop the decimal point."
- id: sci-notation
  name: Giant Scribe
  region: tower
  icon: "🔭"
  summary: "Read, write and compare numbers like 4.5 × 10⁶."

- id: copy-groups
  name: Copycat
  region: mirrors
  icon: "🪞"
  summary: "3(x + 2) means three copies of the whole parcel (x + 2)."
- id: expand
  name: Bracket Buster
  region: mirrors
  icon: "🧨"
  summary: "The number outside multiplies everything inside: 2(x + 3) = 2x + 6."
- id: expand-check
  name: Number Spy
  region: mirrors
  icon: "🕵️"
  summary: "Catch fake rules: put x = 1 into both sides and see if they match."
- id: split-tens
  name: Mind Splitter
  region: mirrors
  icon: "🧠"
  summary: "7 × 12 = 7 × 10 + 7 × 2: split a number, multiply both bits."
- id: round-down
  name: Nearly Ten
  region: mirrors
  icon: "🦇"
  summary: "7 × 9 = 7 × (10 − 1) = 70 − 7. Take off a whole copy, not just 1."

- id: read-point
  name: Sea Reader
  region: bay
  icon: "📍"
  summary: "(3, 5) means 3 along, then 5 up. Along first!"
- id: plot-point
  name: Laser Aim
  region: bay
  icon: "🎯"
  summary: "Find the spot (x, y) on the grid and fire."
- id: table-rule
  name: Ship's Log
  region: bay
  icon: "📋"
  summary: "Fill a table for y = 2x + 3: x = 1 gives 5, x = 2 gives 7…"
- id: step-pattern
  name: Laser Stairs
  region: bay
  icon: "🪜"
  summary: "In y = 2x + 3, each step along climbs 2 — the 3 is where it starts."
- id: line-rule
  name: Beam Reader
  region: bay
  icon: "📈"
  summary: "Read a straight-line graph: start at x = 0, climb per step, and the rule."

- id: closed-loop
  name: Loop Sense
  region: junkyard
  icon: "🔁"
  summary: "Electrons need a complete loop from − round to + (no gaps!)."
- id: volts
  name: Push Power
  region: junkyard
  icon: "🔋"
  summary: "Volts are push. An AA gives 1.5 V; nose-to-tail batteries add up."
- id: current
  name: Baby Counter
  region: junkyard
  icon: "👶"
  summary: "Amps count electrons passing per second — the same all round the loop."
- id: resistance
  name: Mud Tunnel
  region: junkyard
  icon: "🧱"
  summary: "Ohms are squeeze. More ohms, less flow; tunnels in a row add up."
- id: ohm-current
  name: Ohm's Law
  region: junkyard
  icon: "⚡"
  summary: "Current = push ÷ squeeze: I = V ÷ R."
- id: ohm-solve
  name: Bot Tuner
  region: junkyard
  icon: "🤖"
  summary: "V = I × R: work out the volts, the ohms or the batteries a bot needs."

# Trophies. `stat` is a counter bumped by game events (src/engine/events.ts) or a derived stat
# (src/engine/achievements.ts: level, streak, regions, skills, masters, atomsMastered,
# atomsSolid, bosses, wins, graves, petAge, bond, gold, hats, decor, hours, heroics, legendaries,
# mythics, facts, rows, cards, relics) or a per-id stat: campaign:<id>, region:<id>, rank:<region>,
# win:<region>, flawless:<region>, boss:<region>, hunt:<region>. Region trophies (cat: region)
# name their `region`: the Trophy Room groups them and links there. `title` unlocks a title the
# hero can wear. `secret` hides it until earned.


# Trophies. `stat` is a counter bumped by game events (src/engine/events.ts) or a derived stat
# (src/engine/achievements.ts: level, streak, regions, skills, masters, atomsMastered,
# atomsSolid, bosses, wins, graves, petAge, bond, gold, hats, decor, hours, campaign:<id>,
# region:<id>). `title` unlocks a title the hero can wear. `secret` hides it until earned.

